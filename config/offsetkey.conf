# ===================== 蓝牙参数配置 =====================
# 最大连接间隔（1.25ms 单位，9=11.25ms）
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
# 连接延迟（主机跳过的连接事件数）
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
# ACL数据包发送缓冲区数量（ZMK 4.1 要求 BT_BUF_EVT_RX_COUNT > BT_BUF_ACL_TX_COUNT）
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_BUF_EVT_RX_COUNT=64
# L2CAP层发送缓冲区数量
CONFIG_BT_L2CAP_TX_BUF_COUNT=32
# 蓝牙发射功率+8dBm（最大）
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# 启用蓝牙电池服务 
CONFIG_BT_BAS=y

# ===================== 自动休眠相关 =====================
# 自动休眠
CONFIG_ZMK_SLEEP=y
# （已注释）进入自动休眠的时间（单位：ms）
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
#进入空闲状态的时间（单位：ms）
CONFIG_ZMK_IDLE_TIMEOUT=15000

# ===================== BLE实验性功能 =====================
# 启用BLE实验性连接特性
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# 主控端获取从端电池电量
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# 主控端代理电池电量
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# 行为队列大小，提升宏/组合键响应能力
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# ===================== 显示屏相关 =====================
# 启用显示屏支持
CONFIG_ZMK_DISPLAY=y
# 使用内置状态屏幕
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
# 不使用自定义状态屏幕
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=n
# 键盘空闲时息屏
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# ===================== SPI与输入设备 =====================
# 启用SPI总线支持
CONFIG_SPI=y
# 启用输入设备支持
CONFIG_INPUT=y
# 启用外部电源检测
CONFIG_ZMK_EXT_POWER=y

# ===================== 电控相关 =====================
# 以下参数请勿修改，它用于键盘某些外设供电，与RGB背光无关
CONFIG_ZMK_BACKLIGHT=y
# 开机时背光亮度为100，
CONFIG_ZMK_BACKLIGHT_BRT_START=100
# 开机时自动开启背光
CONFIG_ZMK_BACKLIGHT_ON_START=y
# 空闲时自动关闭背光
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n



# ===================== 引脚控制 =====================
# 启用引脚控制
CONFIG_PINCTRL=y

# ===================== 指点设备（鼠标）相关 =====================
# 启用指点设备支持
CONFIG_ZMK_POINTING=y
# 启用平滑滚动
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=n

# ===================== USB日志 =====================
# 启用USB日志输出
CONFIG_ZMK_USB_LOGGING=n

# ===================== RGB灯带相关 =====================
# 启用RGB底灯
CONFIG_ZMK_RGB_UNDERGLOW=y
# 开机时自动开启RGB底灯
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
# 空闲时自动关闭RGB底灯
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# RGB底灯初始色相（绿色系）
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
# RGB底灯初始特效（3号特效）
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
#RGB开关可以同时控制输出电源
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
#The maximum brightness percentage of RGB，Reducing this value can lower the temperature of the rectifier components.(RGB的最大百分比亮度，降低可以减少发热，避免热失控）
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60

# ========== 其它可选项（如有需要可取消注释） ==========
# 断开USB连接时自动关闭RGB灯
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
#防抖时间，如果追求低延迟，可以适当缩短，如果发生连击可适当延长
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Enable 32kHz crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y


CONFIG_GPIO=y
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n
# ===================== 蓝牙配对：不要配对码，设备直连 =====================
# 【改这一段是干什么的】
# 本固件里的 ZMK_BLE_PASSKEY_ENTRY 开关，一旦打开就会出现这种情况：
#   手机 / 电脑点「配对」时不弹输入框，而是要求你在键盘上敲一串 6 位配对码，
#   敲不出来就直接配对失败（很多人以为键盘坏了，其实是被这个拦住了）。
# 下面把它显式关死 —— 不管别的开关怎么连带影响，都保持关闭。
# 结果：任何设备点「配对」就能直接连上，不需要在键盘上输任何密码。
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE 的作用是：
#   允许「已经配对过的同一台设备」重新配对（不必先把键盘里的旧记录清掉）。
# 打开它配对更顺。注意：它在固件里会自动带着打开上面的配对码，
# 所以这两条必须一起写、缺一不可。
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
